# Points Corpus Sync's gmessages source at the OpenMessage export instead of gmcli's.
# Same folder name (gmessages-gmcli) and fields, so the adapter needs no code change.
# Rollback: delete this file, systemctl daemon-reload, re-enable gmcli-export.timer.
[Service]
Environment=LOCALAPPDATA=/var/lib/om-export
Environment=CORPUS_GMESSAGES_MEDIA_DIR=/var/lib/om-export/gmessages-gmcli/media
